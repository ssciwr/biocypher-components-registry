[project]
name = "biocypher-components-registry"
version = "0.1.9"
description = "Registry system for BioCypher adapters with metadata validation, registration workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.121,<1",
    "croissant-baker @ git+https://github.com/MIT-LCP/croissant-baker.git@main",
    "mcp>=2.0,<3",
    "mlcroissant>=1.0.22",
    "jsonschema>=4.23.0",
    "pandas>=2.2.3",
    "prompt-toolkit",
    "psycopg2-binary>=2.9.10",
    "pyarrow>=18.1.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "rich>=13.7.1",
    "sqlalchemy>=2.0",
    "typer>=0.12.5",
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.44.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "httpx",
    "pre-commit",
    "pytest",
    "pytest-bdd",
    "pytest-cov",
]

api-client = [
    "httpie",
]

performance = [
    "locust",
]

[tool.pytest.ini_options]
pythonpath = ["."]
