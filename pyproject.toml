[project]
name = "biocypher-components-registry"
version = "0.1.0"
description = "Registry system for BioCypher adapters with metadata validation, registration workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "croissant-baker",
    "mlcroissant",
    "jsonschema",
    "pandas",
    "psycopg2-binary",
    "pyarrow",
    "pyyaml",
    "requests",
    "rich",
    "sqlalchemy",
    "typer",
    "fastapi",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pre-commit",
    "pytest",
    "pytest-bdd",
    "pytest-cov",
]

api-client = [
    "httpie",
]

performance = [
    "locust",
]

[tool.pytest.ini_options]
pythonpath = ["."]
