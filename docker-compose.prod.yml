services:
  frontend:
    image: ghcr.io/ssciwr/biocypher-components-registry/frontend:0.2.0
    environment:
      # When integrating, adjust this in .env.
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      FRONTEND_SERVER_NAME: ${FRONTEND_SERVER_NAME:-registry.biocypher.org}
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:-registry.biocypher.org}
      TLS_CERTIFICATE_PATH: /etc/letsencrypt/live/${CERTBOT_DOMAIN:-registry.biocypher.org}/fullchain.pem
      TLS_CERTIFICATE_PRIV_PATH: /etc/letsencrypt/live/${CERTBOT_DOMAIN:-registry.biocypher.org}/privkey.pem
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - biocypher-network


  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    environment:
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:-registry.biocypher.org}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    command:
      - certonly
      - --webroot
      - --webroot-path
      - /var/www/certbot
      - --non-interactive
      - --agree-tos
      - --no-eff-email
      - --keep-until-expiring
      - --email
      - ${CERTBOT_EMAIL:-}
      - -d
      - ${CERTBOT_DOMAIN:-registry.biocypher.org}
    networks:
      - biocypher-network

  backend:
    image: ghcr.io/ssciwr/biocypher-components-registry/backend:0.2.0
    env_file: .env
    environment:
      BIOCYPHER_REGISTRY_DB_PATH: /app/data/registry.sqlite3
      # When integrating, adjust these public HTTPS URLs in .env.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://registry.biocypher.org}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://registry.biocypher.org}
    volumes:
      - biocypher-sqlite-data:/app/data
    networks:
      - biocypher-network

networks:
  biocypher-network:
    driver: bridge

volumes:
  biocypher-sqlite-data:
    driver: local
