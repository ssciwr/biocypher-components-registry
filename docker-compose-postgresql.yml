# BioCypher Components Registry - Three-Tier Architecture with PostgreSQL
# Run all tiers: docker compose -f docker-compose-postgresql.yml up

services:
  # ===========================================================
  # Tier 1: Frontend Container (React SPA)
  # ===========================================================
  frontend:
    image: nginx:alpine
    container_name: biocypher-registry-frontend
    ports:
      - "3000:80"
    volumes:
      # Placeholder for future React build output
      - ./frontend-placeholder:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - biocypher-network

  # ===========================================================
  # Tier 2: Backend Container (FastAPI + Uvicorn)
  # ===========================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biocypher-registry-backend
    user: apiuser
    # Reaps processes orphaned by killed run_command process groups.
    init: true
    environment:
      # ===========================================================
      # Database Configuration
      # ===========================================================
      DATABASE_BACKEND: postgresql
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-biocypher}
      POSTGRES_DB: ${POSTGRES_DB:-biocypher_registry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      # ===========================================================
      # GitHub Authentication
      # ===========================================================
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}

      # ===========================================================
      # Frontend and API URLs
      # ===========================================================
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}

      # ===========================================================
      # Repository Policy
      # ===========================================================
      REGISTRY_ALLOWED_REPOSITORY_HOSTS: ${REGISTRY_ALLOWED_REPOSITORY_HOSTS:-}

      # ===========================================================
      # Agentic Workspace
      # ===========================================================
      # Agentic workspace API (src/api/routers/workspace.py): per-session
      # directories live on their own persisted volume.
      AGENT_WORKSPACES_ROOT: /app/data/workspaces
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      BIOCYPHER_MCP_URL: ${BIOCYPHER_MCP_URL:-}
      BIOCYPHER_MCP_AUTH_HEADER: ${BIOCYPHER_MCP_AUTH_HEADER:-}
    ports:
      - "8000:8000"
    volumes:
      - biocypher-workspaces-data:/app/data/workspaces
    # ===========================================================
    # Ephemeral Dataset Upload Scratch (RAM only)
    # ===========================================================
    # Upload sessions are process-local, so keep one Uvicorn worker and one
    # backend replica. Session directories inside this sticky root are 0700.
    tmpfs:
      - /run/biocypher-upload-scratch:rw,noexec,nosuid,nodev,size=268435456,mode=1777
    depends_on:
      database:
        condition: service_healthy
    networks:
      - biocypher-network
    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - src.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  # ===========================================================
  # Tier 3: Database Container (PostgreSQL)
  # ===========================================================
  database:
    image: postgres:16-alpine
    container_name: biocypher-registry-database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biocypher_registry}
      POSTGRES_USER: ${POSTGRES_USER:-biocypher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Optimize for development (adjust for production)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"  # Exposed for debugging/admin tools
    volumes:
      - biocypher-postgres-data:/var/lib/postgresql/data
    networks:
      - biocypher-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

# ===========================================================
# Networks
# ===========================================================
networks:
  biocypher-network:
    driver: bridge

# ===========================================================
# Volumes (Tier 3: Database)
# ===========================================================
volumes:
  # PostgreSQL data directory
  biocypher-postgres-data:
    driver: local
  # Agentic workspace session directories
  biocypher-workspaces-data:
    driver: local
