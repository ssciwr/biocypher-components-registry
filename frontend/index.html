<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="200x200" href="%BASE_URL%favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #fff;
      }

      .app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        opacity: 1;
        transition: opacity 0.4s ease;
        z-index: 50;
      }

      .app-loader--hidden {
        opacity: 0;
        pointer-events: none;
      }

      .app-loader__logo {
        width: 100px;
        height: 100px;
        animation: app-loader-fade-in 0.5s ease-out both;
        object-fit: contain;
      }

      @keyframes app-loader-fade-in {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <output id="app-loader" class="app-loader" aria-label="Loading BioCypher registry">
      <img class="app-loader__logo" src="%BASE_URL%favicon.png" alt="" width="100" height="100" />
    </output>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
