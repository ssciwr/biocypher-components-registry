# Configuration for SonarQube Cloud Automatic Analysis.
# Note: this file is used instead of sonar-project.properties, which is
# ignored when Automatic Analysis is enabled.
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis

# Source encoding
sonar.sourceEncoding=UTF-8

# Python version(s) (for python projects only)
# Accepts a comma-separated list, e.g. 3.12,3.13
# Keep in sync with requires-python in pyproject.toml
sonar.python.version=3.12

# Exclude SDLC documentation artifacts (Markdown docs, HTML/CSS prototypes)
# from analysis. These are design/planning assets, not shipped application code.
sonar.exclusions=sdlc_docs/**

# Exclude generated OpenAPI client artifacts from duplication metrics.
sonar.cpd.exclusions=frontend/src/api/client/**,frontend/src/api/openapi.json
