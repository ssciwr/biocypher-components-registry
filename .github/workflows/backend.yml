name: Backend

# Runs backend Python tests for pull requests that touch backend code,
# backend tests, or backend dependency files. Frontend-only changes are
# handled by the separate Frontend workflow.

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "cli.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python
        # actions/setup-python v6
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: "pyproject.toml"

      - name: Set up uv
        # astral-sh/setup-uv v8.2.0
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev 

      - name: Run tests
        run: uv run --locked pytest --cov --cov-branch --cov-report=xml

      - name: Check coverage report
        run: ls -lh coverage.xml

      - name: Upload coverage to Codecov
        # codecov/codecov-action v7.0.0
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
    
      - name: Minimize uv cache
        run: uv cache prune --ci
