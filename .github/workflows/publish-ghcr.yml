name: Publish Container

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-container-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/backend
  FRONTEND_IMAGE: ${{ github.repository }}/frontend

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          # The above ensures we get all existing release tags to properly create the right tag (increment etc)

      - name: Compute next release tag
        id: version
        shell: bash
        run: |
          project_version="$(python3 -c 'import pathlib, tomllib; print(tomllib.load(pathlib.Path("pyproject.toml").open("rb"))["project"]["version"])')"
          # Accept existing specified hardcoded vrsions in pyproject; especially for now to avoid updating a new image that remote could pull and update with
          # Below is a little overcautious and can be changed back when are operate releases normally and create releases tags / promote images to release tags here at the end of this publish step in the future
          IFS='.' read -r project_major project_minor project_patch <<< "$project_version"
          latest_any_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -n "$latest_any_tag" ]; then
            latest_any_version="${latest_any_tag#v}"
            IFS='.' read -r latest_any_major latest_any_minor _latest_any_patch <<< "$latest_any_version"
            if [ "$latest_any_major" -gt "$project_major" ] || { [ "$latest_any_major" -eq "$project_major" ] && [ "$latest_any_minor" -gt "$project_minor" ]; }; then
              echo "pyproject.toml project.version $project_version is behind latest release tag $latest_any_tag" >&2
              exit 1
            fi
          fi

          latest_project_tag="$(git tag --list "v${project_major}.${project_minor}.[0-9]*" --sort=-v:refname | head -n 1)"
          if [ -z "$latest_project_tag" ]; then
            next_tag="v${project_major}.${project_minor}.$((10#$project_patch + 1))"
          else
            latest_project_version="${latest_project_tag#v}"
            IFS='.' read -r _latest_project_major _latest_project_minor latest_project_patch <<< "$latest_project_version"
            next_tag="v${project_major}.${project_minor}.$((10#$latest_project_patch + 1))"
          fi
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"

      - name: Validate GHCR credentials
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if { [ -n "$GHCR_USERNAME" ] && [ -z "$GHCR_PAT" ]; } || { [ -z "$GHCR_USERNAME" ] && [ -n "$GHCR_PAT" ]; }; then
            echo "Set both GHCR_USERNAME and GHCR_PAT, or leave both unset to use GITHUB_TOKEN." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.2.0.
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GHCR
        # docker/login-action v4.4.0.
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_PAT != '' && secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and publish backend SHA image
        # docker/build-push-action v7.3.0.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and publish frontend SHA image
        # docker/build-push-action v7.3.0.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
