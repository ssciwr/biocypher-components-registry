name: Update BioCypher Adapters Registry

on:
  schedule:
    - cron: '0 */2 * * *'  # Runs daily every two hours;
  workflow_dispatch:      # Manual trigger option

jobs:
  update-registry:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
      with:
        python-version: '3.12'

    - name: Set up uv
      # astral-sh/setup-uv v8.2.0
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        enable-cache: true

    - name: Install dependencies
      # dependencies come from the locked uv.lock file in CI.
      run: uv sync --locked --no-dev # NOSONAR

    - name: Fetch adapters metadata
      run: .venv/bin/python scripts/fetch_adapters.py

    - name: Generate aggregated registry
      run: .venv/bin/python scripts/generate_registry.py

    - name: Commit and push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add registry_data unified_adapters_metadata.jsonld
        git diff --cached --quiet || git commit -m "Update adapters registry metadata"
        git push
