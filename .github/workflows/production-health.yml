name: Production health # will notify any of us if the API goes down.

on:
  schedule:
    - cron: '7 * * * *'

permissions: {}

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

    steps:
      - name: Check production
        run: |
          api_base_url="${VITE_API_BASE_URL:-https://registry.biocypher.org}"
          health_url="${api_base_url%/}/api/v1/health"
          curl --fail --silent --show-error --max-time 20 "$health_url"
