name: Validate Schema

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate schema for the example adapter collectri
        # ssciwr/validate-croissant-schema v0
        uses: ssciwr/validate-croissant-schema@d3586807e86dd57c4dea42f7833ee9e23c5bbaf9
        with:
          file: "data/in/adapter_collectri/collectri.json"
          python-version: ${{ matrix.python-version }}
