name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  lint-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34
        with:
          version: 10.6.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm run lint

      - name: Build frontend
        run: pnpm run build

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Verify Cypress
        run: pnpm exec cypress verify

      - name: Run Cypress tests
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7
        with:
          working-directory: frontend
          install: false
          start: pnpm exec vite preview --host 127.0.0.1 --port 5173 --strictPort
          wait-on: "http://127.0.0.1:5173"
          wait-on-timeout: 120
          command: pnpm run ui-tests
