name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  lint-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        # actions/checkout v7.01 # same as in publish GHCR to ensure it's identical.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        # pnpm/action-setup v6.0.9
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.6.2

      - name: Set up Node.js
        # actions/setup-node v7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint frontend
        run: pnpm run lint

      - name: Build frontend
        run: pnpm run build

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Verify Cypress
        run: pnpm exec cypress verify

      - name: Run Cypress tests
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7
        with:
          working-directory: frontend
          install: false
          start: pnpm exec vite preview --host 127.0.0.1 --port 5173 --strictPort
          wait-on: "http://127.0.0.1:5173"
          wait-on-timeout: 120
          command: pnpm run ui-tests
